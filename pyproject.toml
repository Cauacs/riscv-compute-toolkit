[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riscv-compute-toolkit"
version = "0.1.0"
description = "Trustworthy numerical-computing experiments for RISC-V"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = []
dependencies = []

[project.scripts]
rct = "rct.cli:main"

[tool.setuptools.packages.find]
include = ["rct*"]
